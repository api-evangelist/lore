name: Lore
description: Lore is a multichain wallet for groups to win together, a co-ownership platform that lets
  collectives launch shared, multi-signature Safe wallets across Solana, Ethereum, Base, Blast, and
  Arbitrum. Its Co-Ownership Framework is an equity-tracking system over shared Vaults that lets a group
  start small and grow both assets and members over time, using Proposals, Group Deposits, Exits,
  Distributions, and Valuations to manage on-chain treasuries and investment clubs together. Lore
  provides a consumer application and documentation but does not currently publish a public developer
  API, SDK, or OpenAPI surface.
